version: 2
builds:
  - id: github-app-sts-server
    main: ./cmd/github-app-sts-server
    binary: github-app-sts-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: github-app-sts-client
    main: ./cmd/github-app-sts-client
    binary: github-app-sts-client
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: git-credential-github-app-sts
    main: ./cmd/git-credential-github-app-sts
    binary: git-credential-github-app-sts
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin]
    goarch: [amd64, arm64]

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle
      - '${artifact}.bundle'
      - '${artifact}'
    artifacts: binary

docker_signs:
  - cmd: cosign
    args:
      - sign
      - --yes
      - '${artifact}'
    artifacts: all

dockers_v2:
  - ids:
      - github-app-sts-server
    images:
      - us-central1-docker.pkg.dev/etsy-github-tooling-prod/github-app-sts-binaries/github-app-sts-server
    dockerfile: Dockerfile
    tags:
      - 'v{{ .Version }}'
      - '{{ .FullCommit }}'
      - latest
    platforms:
      - linux/amd64
